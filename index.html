<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Miles Server</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

.video-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: calc(100% - 40px);
    background: #000;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: #000;
}

footer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 40px;
    background: #000;

    display: flex;
    align-items: center;
    justify-content: center;
}

footer img {
    max-height: 22px;
}
</style>
</head>

<body>

<div class="video-container">
    <iframe
        src="https://pve.tail0dc390.ts.net/"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>
</div>

<footer>
    <img
       src="https://vbr.nathanchung.dev/badge?page_id=project-vector-miles-server&text=Visitors&color=333333&lcolor=111111"
        alt="Visitor counter">
</footer>

</body>
</html>
