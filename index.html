<!doctype html>
<html lang="en-GB">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Project Vector</title>
    <style>
        body {
            margin: 0;
            min-height: 100svh;
            display: grid;
            grid-template-rows: 1fr auto;
            background: #000;
            color: #bdbdbd;
            font-family: system-ui, sans-serif;
        }

        main {
            display: grid;
            place-items: center;
            padding: 1rem;
        }

        video {
            display: block;
            width: 100%;
            max-width: 800px;
            max-height: 75svh;
        }

        footer {
            padding: 1.25rem;
            border-top: 1px solid #282828;
            text-align: center;
            letter-spacing: 0.2em;
        }
    </style>
</head>
<body>
    <main>
        <video autoplay muted loop playsinline controls
               aria-label="Rick Astley — Never Gonna Give You Up">
            <source src="./rickroll.mp4" type="video/mp4">
            <a href="./rickroll.mp4">Play the video</a>
        </video>
    </main>
    <footer>Project Vector</footer>
</body>
</html>
