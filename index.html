<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Miles Server</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* VIDEO PLAYER */

.video-container {
    width: 100%;
    height: calc(100vh - 90px);
    height: calc(100dvh - 90px);
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
}

.video-container iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: black;
}

/* VISITOR COUNTER */

footer {
    width: 100%;
    height: 90px;
    background: #080808;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    border-top: 1px solid #252525;
}

.counter-label {
    color: #aaa;
    font-size: 12px;
    letter-spacing: 3px;
    margin-bottom: 10px;
}

.counter img {
    min-height: 22px;
    max-height: 30px;
}

</style>
</head>

<body>

<!-- VIDEO JUKEBOX -->

<div class="video-container">

    <iframe
        src="https://pve.tail0dc390.ts.net/"
        allow="autoplay; fullscreen; encrypted-media"
        allowfullscreen>
    </iframe>

</div>

<!-- VISITOR COUNTER -->

<footer>

    <div class="counter-label">
        MILES SERVER
    </div>

    <div class="counter">

        <img
            src="https://vbr.nathanchung.dev/badge?page_id=project-vector-miles-server&text=Visitors&color=444444&lcolor=222222"
            alt="Visitor counter">

    </div>

</footer>

</body>
</html>
